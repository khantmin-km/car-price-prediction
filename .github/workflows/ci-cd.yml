# On every push: run the model unit tests, then build, push and deploy the image if they pass
name: CI/CD

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Get the repo's files onto the runner
      - uses: actions/checkout@v5

      # Install uv and the same Python version as the Docker image
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      # App packages + pytest only (no jupyter/mlflow), exactly as in uv.lock
      - name: Install dependencies
        run: uv sync --frozen --no-dev --group test

      - name: Run unit tests
        run: uv run --no-sync pytest -v

  build-push:
    # Only runs after the tests pass
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Docker's builder that can build and push in one step
      - uses: docker/setup-buildx-action@v3

      # Log in with the token saved in the repo's secrets
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build from the repo root with our Dockerfile, for the server's platform
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/.Dockerfile
          platforms: linux/amd64
          push: true
          tags: khantminn/car-price-prediction:a3

  deploy:
    # Only runs after the new image is on Docker Hub
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      # Log in to ml-brain through bazooka with the deploy key, then start the new image
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ml.brain.cs.ait.ac.th
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          proxy_host: bazooka.cs.ait.ac.th
          proxy_username: ${{ secrets.SSH_USERNAME }}
          proxy_key: ${{ secrets.SSH_KEY }}
          # pull first: the tag stays "a3", so without it the server keeps its old copy
          script: |
            tag=a3 docker compose -f st127634/docker-compose.yaml pull
            tag=a3 docker compose -f st127634/docker-compose.yaml up -d
