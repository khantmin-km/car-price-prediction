services:
  dash:
    build:
      context: ..
      dockerfile: app/.Dockerfile
    image: car-price-prediction:dev
    ports:
      - "8050:8050"
    environment:
      HOST: 0.0.0.0
      PORT: 8050
      DEBUG: "false"
      DEMO_MODE: "false"
    volumes:
      - ./code:/app/code
    restart: unless-stopped
