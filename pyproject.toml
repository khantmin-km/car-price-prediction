[project]
name = "car-price-prediction"
version = "0.1.0"
description = "AST02-12 A1+A2: car price prediction, custom regression, and Dash deployment"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.3,<1.4",
    "dash>=2.17",
    "dash-bootstrap-components>=1.6",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "mlflow>=2.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
